<!-- Result Card -->
<div class="card glass-card border-success border-opacity-25 result-reveal mb-0" id="resultCard">
    <div class="card-body p-3 p-md-4">

        <!-- Header row -->
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
            <div>
                <div class="d-flex align-items-center gap-2 mb-1">
                    <i class="fa-solid fa-circle-check text-success" aria-hidden="true"></i>
                    <span class="fw-semibold text-success">
                        Hasil {{ 'Enkripsi' if mode == 'encrypt' else 'Dekripsi' }}
                    </span>
                </div>
                <span class="badge px-2 py-1 text-capitalize fw-medium"
                      style="background: rgba(99,102,241,.2); color: var(--c-indigo);
                             border: 1px solid rgba(99,102,241,.3); font-size:.72rem;">
                    {{ algo }}
                </span>
            </div>
            <button class="btn btn-sm btn-outline-success"
                    id="copyBtn"
                    data-clipboard-text="{{ result_data.result }}"
                    title="Salin hasil ke clipboard">
                <i class="fa-regular fa-copy me-1" aria-hidden="true"></i>
                <span id="copyBtnLabel">Salin</span>
            </button>
        </div>

        <!-- Result text -->
        <div class="result-box mb-3">
            <p class="font-monospace text-break mb-0 fw-semibold fs-5" id="resultText">
                {{- result_data.result -}}
            </p>
        </div>

        <!-- Formula -->
        <div>
            <p class="small text-uppercase fw-bold text-muted mb-1" style="letter-spacing:.05em; font-size:.68rem;">
                Formula
            </p>
            <div class="formula-box">{{ result_data.formula }}</div>
        </div>

    </div>
</div>
